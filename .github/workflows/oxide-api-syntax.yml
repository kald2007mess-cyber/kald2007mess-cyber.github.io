name: OXIDE HUB API syntax

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/d1-schema-compatibility

jobs:
  api-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check API JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find functions/api -type f -name '*.js' -print0)
