<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OXIDE HUB - Downloads</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 25px 15px;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background:
    linear-gradient(rgba(3,8,22,.72), rgba(3,8,22,.92)),
    url("background.png") center/cover fixed;
}

.container { max-width: 430px; margin: auto; }
.language-box { display: flex; justify-content: flex-end; }

select {
  background: #0c1930;
  color: white;
  border: 1px solid #176caa;
  border-radius: 8px;
  padding: 9px;
}

.logo {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 3px;
  color: white;
  text-shadow: 0 0 15px #00aaff;
  margin: 25px 0 8px;
}

.subtitle { color: #b8c9dd; margin-bottom: 25px; }

.section {
  background: rgba(12,25,48,.9);
  border: 1px solid #176caa;
  border-radius: 14px;
  padding: 18px;
  margin: 16px 0;
}

.section h2 { color: #00b7ff; font-size: 19px; margin-top: 0; }

.file-info {
  color: #c5d5e8;
  font-size: 13px;
  margin: 12px 0;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.download-btn {
  display: block;
  width: 100%;
  padding: 14px;
  background: #087ed0;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  margin-top: 12px;
  border: 0;
  cursor: pointer;
}

.download-btn:active { transform: scale(.98); }

.video-frame {
  width: min(100%, 320px);
  aspect-ratio: 9 / 16;
  margin: 15px auto 0;
  border: 1px solid #176caa;
  border-radius: 12px;
  background: #000;
  overflow: hidden;
  box-shadow: 0 0 18px rgba(0,183,255,.15);
}

.video-frame video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border: 0;
  background: #000;
}

.back-btn {
  display: block;
  padding: 14px;
  margin-top: 22px;
  border: 1px solid #176caa;
  border-radius: 10px;
  color: white;
  text-decoration: none;
  background: rgba(12,25,48,.9);
}

footer { margin-top: 30px; color: #879bb2; font-size: 12px; }

@media (max-width: 360px) {
  .video-frame { width: min(100%, 280px); }
}

.progress-box {
  display: none;
  margin-top: 12px;
  padding: 12px;
  background: rgba(3,12,28,.75);
  border: 1px solid #176caa;
  border-radius: 10px;
}

.progress-track {
  width: 100%;
  height: 12px;
  overflow: hidden;
  background: #071326;
  border-radius: 20px;
  border: 1px solid rgba(0,183,255,.35);
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #087ed0, #00d4ff);
  border-radius: 20px;
  transition: width .15s linear;
}

.progress-label {
  display: block;
  margin-top: 8px;
  color: #c5d5e8;
  font-size: 13px;
}

.empty-message { color: #a9bad0; font-size: 13px; }
[hidden] { display: none !important; }
</style>
</head>

<body>
<main class="container">
  <div class="language-box">
    <select id="language" onchange="changeLanguage(this.value)">
      <option value="ar">🇩🇿 العربية</option>
      <option value="en">🇬🇧 English</option>
      <option value="ru">🇷🇺 Русский</option>
    </select>
  </div>

  <div class="logo">OXIDE HUB</div>
  <div class="subtitle">SURVIVE • EXPLORE • DOMINATE</div>

  <section class="section" id="file1Section">
    <h2 id="file1Title">📦 الملف الأول</h2>
    <div class="file-info" id="file1Info">جارٍ تحميل بيانات الملف...</div>
    <a class="download-btn" id="file1Download" href="#" hidden>
      ⬇️ <span id="file1Button">تحميل الملف الأول</span>
    </a>
    <div class="progress-box" id="file1ProgressBox">
      <div class="progress-track"><div class="progress-fill" id="file1ProgressFill"></div></div>
      <span class="progress-label" id="file1ProgressLabel">0%</span>
    </div>
    <button class="download-btn" id="file1Redownload" type="button" hidden>↻ إعادة تحميل الملف الأول</button>
  </section>

  <section class="section" id="file2Section">
    <h2 id="file2Title">📦 الملف الثاني</h2>
    <div class="file-info" id="file2Info">جارٍ تحميل بيانات الملف...</div>
    <a class="download-btn" id="file2Download" href="#" hidden>
      ⬇️ <span id="file2Button">تحميل الملف الثاني</span>
    </a>
    <div class="progress-box" id="file2ProgressBox">
      <div class="progress-track"><div class="progress-fill" id="file2ProgressFill"></div></div>
      <span class="progress-label" id="file2ProgressLabel">0%</span>
    </div>
    <button class="download-btn" id="file2Redownload" type="button" hidden>↻ إعادة تحميل الملف الثاني</button>
  </section>

  <section class="section" id="videoSection" hidden>
    <h2 id="videoTitle">🎬 فيديو الشرح</h2>
    <div class="file-info" id="videoInfo">شاهد الشرح هنا دون مغادرة الموقع.</div>
    <div class="video-frame">
      <video id="tutorialVideo" controls playsinline preload="metadata"></video>
    </div>
  </section>

  <a href="index.html" class="back-btn" id="backButton">↩ العودة إلى OXIDE HUB</a>

  <footer>
    OXIDE HUB © 2026<br>
    Created by SKIMI_17
  </footer>
</main>

<script>
const translations = {
  ar: {
    file1Title: "📦 الملف الأول",
    file1Button: "تحميل الملف الأول",
    file2Title: "📦 الملف الثاني",
    file2Button: "تحميل الملف الثاني",
    redownload1: "↻ إعادة تحميل الملف الأول",
    redownload2: "↻ إعادة تحميل الملف الثاني",
    loading: "جارٍ تحميل بيانات الملف...",
    unavailable: "لا يوجد ملف متاح حاليًا.",
    downloading: "جارٍ تحميل الملف...",
    completed: "اكتمل التنزيل 100% — جارٍ حفظ الملف",
    failed: "تعذر التنزيل. تحقق من الاتصال أو إعدادات CORS.",
    videoTitle: "🎬 فيديو الشرح",
    videoInfo: "شاهد الشرح هنا دون مغادرة الموقع.",
    backButton: "↩ العودة إلى OXIDE HUB",
    version: "الإصدار",
    description: "الوصف",
    fileName: "الملف"
  },
  en: {
    file1Title: "📦 FILE 1",
    file1Button: "DOWNLOAD FILE 1",
    file2Title: "📦 FILE 2",
    file2Button: "DOWNLOAD FILE 2",
    redownload1: "↻ DOWNLOAD FILE 1 AGAIN",
    redownload2: "↻ DOWNLOAD FILE 2 AGAIN",
    loading: "Loading file information...",
    unavailable: "No file is currently available.",
    downloading: "Downloading file...",
    completed: "Download received 100% — saving file",
    failed: "Download failed. Check connection or CORS settings.",
    videoTitle: "🎬 VIDEO TUTORIAL",
    videoInfo: "Watch the tutorial here without leaving the website.",
    backButton: "↩ BACK TO OXIDE HUB",
    version: "Version",
    description: "Description",
    fileName: "File"
  },
  ru: {
    file1Title: "📦 ФАЙЛ 1",
    file1Button: "СКАЧАТЬ ФАЙЛ 1",
    file2Title: "📦 ФАЙЛ 2",
    file2Button: "СКАЧАТЬ ФАЙЛ 2",
    redownload1: "↻ СКАЧАТЬ ФАЙЛ 1 СНОВА",
    redownload2: "↻ СКАЧАТЬ ФАЙЛ 2 СНОВА",
    loading: "Загрузка информации о файле...",
    unavailable: "Файл сейчас недоступен.",
    downloading: "Загрузка файла...",
    completed: "Загрузка получена на 100% — сохранение файла",
    failed: "Не удалось загрузить. Проверьте соединение или CORS.",
    videoTitle: "🎬 ВИДЕОИНСТРУКЦИЯ",
    videoInfo: "Смотрите инструкцию здесь, не покидая сайт.",
    backButton: "↩ НАЗАД В OXIDE HUB",
    version: "Версия",
    description: "Описание",
    fileName: "Файл"
  }
};

let currentFiles = [];

function currentText(key) {
  const language = document.getElementById("language").value || "ar";
  return translations[language][key] || translations.ar[key] || key;
}

function changeLanguage(language) {
  const selected = translations[language];
  if (!selected) return;

  document.documentElement.lang = language;
  document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

  ["file1Title", "file1Button", "file2Title", "file2Button",
   "videoTitle", "videoInfo", "backButton"].forEach(key => {
    const element = document.getElementById(key);
    if (element) element.textContent = selected[key];
  });

  renderFiles();
}

function getPlatformFiles(data) {
  // الاستجابة الفعلية من /api/platforms تضع الملفات داخل platforms.android.
  const platformFiles = data &&
    data.platforms &&
    Array.isArray(data.platforms.android)
      ? data.platforms.android
      : [];

  // توافق احتياطي مع أشكال الاستجابة القديمة.
  const list = platformFiles.length
    ? platformFiles
    : Array.isArray(data.downloads)
      ? data.downloads
      : Array.isArray(data.files)
        ? data.files
        : Array.isArray(data.platform_files)
          ? data.platform_files
          : [];

  return list
    .filter(file => file && String(file.platform || "android").toLowerCase() === "android")
    .filter(file => file.enabled === true || Number(file.enabled) === 1)
    .sort((a, b) => Number(a.slot || 1) - Number(b.slot || 1));
}

function renderFiles() {
  for (let slot = 1; slot <= 2; slot++) {
    const file = currentFiles.find(item => Number(item.slot || 1) === slot);
    const info = document.getElementById(`file${slot}Info`);
    const link = document.getElementById(`file${slot}Download`);
    const button = document.getElementById(`file${slot}Button`);
    const redo = document.getElementById(`file${slot}Redownload`);
    redo.textContent = currentText(`redownload${slot}`);
    redo.hidden = true;

    if (!file) {
      info.textContent = currentText("unavailable");
      link.hidden = true;
      link.removeAttribute("href");
      continue;
    }

    const details = [];
    const title = String(file.title || file.file_name || currentText("fileName"));
    if (file.version) details.push(`${currentText("version")}: ${file.version}`);
    if (file.description) details.push(file.description);
    if (file.file_name) details.push(file.file_name);

    info.textContent = [title, ...details].join(" — ");

    const fileId = String(file.id || "").trim();
    if (fileId) {
      link.href = "/api/download?id=" + encodeURIComponent(fileId) + "&platform=android";
      link.hidden = false;
      link.dataset.fileId = fileId;
      link.dataset.fileName = file.file_name || title;
      button.textContent = currentText(`file${slot}Button`);
    } else {
      link.hidden = true;
      link.removeAttribute("href");
    }
  }
}

async function loadPlatformData() {
  const info1 = document.getElementById("file1Info");
  const info2 = document.getElementById("file2Info");
  info1.textContent = currentText("loading");
  info2.textContent = currentText("loading");

  try {
    const response = await fetch("/api/platforms", {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) throw new Error("Platforms API HTTP " + response.status);

    const data = await response.json();
    currentFiles = getPlatformFiles(data);
    renderFiles();

    const videoUrl = data && data.tutorials && data.tutorials.android;
    if (typeof videoUrl === "string" && /^https:\/\/[^\s]+$/i.test(videoUrl)) {
      const video = document.getElementById("tutorialVideo");
      video.src = videoUrl;
      document.getElementById("videoSection").hidden = false;
      video.load();
    } else {
      document.getElementById("videoSection").hidden = true;
    }
  } catch (error) {
    console.error("Android downloads loading error:", error);
    info1.textContent = currentText("unavailable");
    info2.textContent = currentText("unavailable");
    document.getElementById("videoSection").hidden = true;
  }
}

async function startDownload(fileNumber) {
  const link = document.getElementById(`file${fileNumber}Download`);
  const box = document.getElementById(`file${fileNumber}ProgressBox`);
  const fill = document.getElementById(`file${fileNumber}ProgressFill`);
  const label = document.getElementById(`file${fileNumber}ProgressLabel`);

  if (!link || link.dataset.downloading === "true" || !link.href) return;

  const url = link.href;
  const rawName = link.dataset.fileName || `oxide-file-${fileNumber}`;
  const filename = rawName.replace(/[\\/:*?"<>|]/g, "_");

  link.dataset.downloading = "true";
  link.style.display = "none";
  box.style.display = "block";
  fill.style.width = "0%";
  label.textContent = "0%";

  try {
    const response = await fetch(url, {
      method: "GET",
      cache: "no-store",
      credentials: "same-origin"
    });
    if (!response.ok) throw new Error("HTTP " + response.status);

    if (!response.body) throw new Error("Streaming not supported");
    const total = Number(response.headers.get("Content-Length")) || 0;

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;

      if (total > 0) {
        const percent = Math.min(100, Math.round((received / total) * 100));
        fill.style.width = percent + "%";
        label.textContent = percent + "%";
      } else {
        label.textContent = (received / (1024 * 1024)).toFixed(1) + " MB";
      }
    }

    if (total > 0 && received !== total) {
      throw new Error("The file transfer was incomplete. Please retry.");
    }

    const blob = new Blob(chunks, {
      type: response.headers.get("Content-Type") || "application/octet-stream"
    });
    const objectUrl = URL.createObjectURL(blob);
    const saveLink = document.createElement("a");
    saveLink.href = objectUrl;
    saveLink.download = filename;
    document.body.appendChild(saveLink);
    saveLink.click();
    saveLink.remove();
    setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
    fill.style.width = "100%";
    label.textContent = currentText("completed");
    link.dataset.downloading = "false";
    document.getElementById(`file${fileNumber}Redownload`).hidden = false;
  } catch (error) {
    console.error("Download error:", error);
    label.textContent = currentText("failed");
    box.style.display = "none";
    fill.style.width = "0%";
    link.dataset.downloading = "false";
    link.style.display = "block";
    document.getElementById(`file${fileNumber}Redownload`).hidden = true;
  }
}

document.getElementById("file1Download").addEventListener("click", event => {
  event.preventDefault();
  startDownload(1);
});
document.getElementById("file2Download").addEventListener("click", event => {
  event.preventDefault();
  startDownload(2);
});
document.getElementById("file1Redownload").addEventListener("click", () => startDownload(1));
document.getElementById("file2Redownload").addEventListener("click", () => startDownload(2));

changeLanguage("ar");
loadPlatformData();
</script>
</body>
</html>
