
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OXIDE HUB - Downloads</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 25px 15px;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background:
    linear-gradient(rgba(3,8,22,.72), rgba(3,8,22,.92)),
    url("background.png") center/cover fixed;
}

.container {
  max-width: 430px;
  margin: auto;
}

.language-box {
  display: flex;
  justify-content: flex-end;
}

select {
  background: #0c1930;
  color: white;
  border: 1px solid #176caa;
  border-radius: 8px;
  padding: 9px;
}

.logo {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 3px;
  color: white;
  text-shadow: 0 0 15px #00aaff;
  margin: 25px 0 8px;
}

.subtitle {
  color: #b8c9dd;
  margin-bottom: 25px;
}

.section {
  background: rgba(12,25,48,.9);
  border: 1px solid #176caa;
  border-radius: 14px;
  padding: 18px;
  margin: 16px 0;
}

.section h2 {
  color: #00b7ff;
  font-size: 19px;
  margin-top: 0;
}

.file-info {
  color: #c5d5e8;
  font-size: 13px;
  margin: 12px 0;
  line-height: 1.7;
}

.download-btn {
  display: block;
  width: 100%;
  padding: 14px;
  background: #087ed0;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  margin-top: 12px;
}

.download-btn:active {
  transform: scale(.98);
}

/* VIDEO - VERTICAL 9:16 */
.video-frame {
  width: min(100%, 320px);
  aspect-ratio: 9 / 16;
  margin: 15px auto 0;
  border: 1px solid #176caa;
  border-radius: 12px;
  background: #000;
  overflow: hidden;
  box-shadow: 0 0 18px rgba(0,183,255,.15);
}

.video-frame iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

.back-btn {
  display: block;
  padding: 14px;
  margin-top: 22px;
  border: 1px solid #176caa;
  border-radius: 10px;
  color: white;
  text-decoration: none;
  background: rgba(12,25,48,.9);
}

footer {
  margin-top: 30px;
  color: #879bb2;
  font-size: 12px;
}

/* SMALL PHONES */
@media (max-width: 360px) {
  .video-frame {
    width: min(100%, 280px);
  }
}
</style>
</head>

<body>

<main class="container">

  <div class="language-box">
    <select id="language" onchange="changeLanguage(this.value)">
      <option value="ar">🇩🇿 العربية</option>
      <option value="en">🇬🇧 English</option>
      <option value="ru">🇷🇺 Русский</option>
    </select>
  </div>

  <div class="logo">OXIDE HUB</div>
  <div class="subtitle">SURVIVE • EXPLORE • DOMINATE</div>

  <section class="section">
    <h2 id="file1Title">📦 الملف الأول</h2>

    <div class="file-info" id="file1Info">
      Lulu.BoxSuper 2.1.2
    </div>

    <a class="download-btn"
       href="https://drive.google.com/uc?export=download&id=1g4zpmxW5MiS_V1N3rOqU6bBPDSBiglTE"
       target="_blank"
       rel="noopener">
      ⬇️ <span id="file1Button">تحميل الملف الأول</span>
    </a>
  </section>

  <section class="section">
    <h2 id="file2Title">📦 الملف الثاني</h2>

    <div class="file-info" id="file2Info">
      Phantom.zip
    </div>

    <a class="download-btn"
       href="https://drive.google.com/uc?export=download&id=165WWN2ls-6VzeNdB7Qou0K_2XJDNkYrG"
       target="_blank"
       rel="noopener">
      ⬇️ <span id="file2Button">تحميل الملف الثاني</span>
    </a>
  </section>

  <section class="section">
    <h2 id="videoTitle">🎬 فيديو الشرح</h2>

    <div class="file-info" id="videoInfo">
      شاهد الشرح هنا دون مغادرة الموقع.
    </div>

    <div class="video-frame">
      <iframe
        src="https://drive.google.com/file/d/1hIs5kuMntiXeB7IRx__83viLZHLn7lwB/preview"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <a href="index.html" class="back-btn" id="backButton">
    ↩ العودة إلى OXIDE HUB
  </a>

  <footer>
    OXIDE HUB © 2026<br>
    Created by SKIMI_17
  </footer>

</main>

<script>
const translations = {
  ar: {
    file1Title: "📦 الملف الأول",
    file1Info: "Lulu.BoxSuper 2.1.2",
    file1Button: "تحميل الملف الأول",
    file2Title: "📦 الملف الثاني",
    file2Info: "Phantom.zip",
    file2Button: "تحميل الملف الثاني",
    videoTitle: "🎬 فيديو الشرح",
    videoInfo: "شاهد الشرح هنا دون مغادرة الموقع.",
    backButton: "↩ العودة إلى OXIDE HUB"
  },

  en: {
    file1Title: "📦 FILE 1",
    file1Info: "Lulu.BoxSuper 2.1.2",
    file1Button: "DOWNLOAD FILE 1",
    file2Title: "📦 FILE 2",
    file2Info: "Phantom.zip",
    file2Button: "DOWNLOAD FILE 2",
    videoTitle: "🎬 VIDEO TUTORIAL",
    videoInfo: "Watch the tutorial here without leaving the website.",
    backButton: "↩ BACK TO OXIDE HUB"
  },

  ru: {
    file1Title: "📦 ФАЙЛ 1",
    file1Info: "Lulu.BoxSuper 2.1.2",
    file1Button: "СКАЧАТЬ ФАЙЛ 1",
    file2Title: "📦 ФАЙЛ 2",
    file2Info: "Phantom.zip",
    file2Button: "СКАЧАТЬ ФАЙЛ 2",
    videoTitle: "🎬 ВИДЕОИНСТРУКЦИЯ",
    videoInfo: "Смотрите инструкцию здесь, не покидая сайт.",
    backButton: "↩ НАЗАД В OXIDE HUB"
  }
};

function changeLanguage(language) {
  const selected = translations[language];
  if (!selected) return;

  document.documentElement.lang = language;
  document.documentElement.dir =
    language === "ar" ? "rtl" : "ltr";

  Object.keys(selected).forEach(key => {
    document.getElementById(key).textContent = selected[key];
  });
}

changeLanguage("ar");
</script>

</body>
</html>
