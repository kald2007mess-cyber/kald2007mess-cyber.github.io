<script>
const translations = {
  ar: {
    file1Title: "📦 الملف الأول",
    file1Info: "Lulu.BoxSuper 2.1.2",
    file1Button: "تحميل الملف الأول",
    file2Title: "📦 الملف الثاني",
    file2Info: "Phantom.zip",
    file2Button: "تحميل الملف الثاني",
    downloading: "جارٍ تحميل الملف...",
    completed: "اكتمل التنزيل 100% — جارٍ حفظ الملف",
    failed: "تعذر التنزيل. تحقق من الاتصال أو إعدادات CORS.",
    videoTitle: "🎬 فيديو الشرح",
    videoInfo: "شاهد الشرح هنا دون مغادرة الموقع.",
    backButton: "↩ العودة إلى OXIDE HUB"
  },

  en: {
    file1Title: "📦 FILE 1",
    file1Info: "Lulu.BoxSuper 2.1.2",
    file1Button: "DOWNLOAD FILE 1",
    file2Title: "📦 FILE 2",
    file2Info: "Phantom.zip",
    file2Button: "DOWNLOAD FILE 2",
    downloading: "Downloading file...",
    completed: "Download received 100% — saving file",
    failed: "Download failed. Check connection or CORS settings.",
    videoTitle: "🎬 VIDEO TUTORIAL",
    videoInfo: "Watch the tutorial here without leaving the website.",
    backButton: "↩ BACK TO OXIDE HUB"
  },

  ru: {
    file1Title: "📦 ФАЙЛ 1",
    file1Info: "Lulu.BoxSuper 2.1.2",
    file1Button: "СКАЧАТЬ ФАЙЛ 1",
    file2Title: "📦 ФАЙЛ 2",
    file2Info: "Phantom.zip",
    file2Button: "СКАЧАТЬ ФАЙЛ 2",
    downloading: "Загрузка файла...",
    completed: "Загрузка получена на 100% — сохранение файла",
    failed: "Не удалось загрузить. Проверьте соединение или CORS.",
    videoTitle: "🎬 ВИДЕОИНСТРУКЦИЯ",
    videoInfo: "Смотрите инструкцию здесь, не покидая сайт.",
    backButton: "↩ НАЗАД В OXIDE HUB"
  }
};

function changeLanguage(language) {
  const selected = translations[language];
  if (!selected) return;

  document.documentElement.lang = language;
  document.documentElement.dir =
    language === "ar" ? "rtl" : "ltr";

  Object.keys(selected).forEach(key => {
    document.getElementById(key).textContent = selected[key];
  });
}


async function startDownload(fileNumber) {
  const link = document.getElementById(`file${fileNumber}Download`);
  const box = document.getElementById(`file${fileNumber}ProgressBox`);
  const fill = document.getElementById(`file${fileNumber}ProgressFill`);
  const label = document.getElementById(`file${fileNumber}ProgressLabel`);

  if (!link || link.dataset.downloading === "true") return;

  const url = link.href;
  const filename = fileNumber === 1
    ? "LuluBoxSuper_2.1.2.apk"
    : "crack-phantom.apk";

  link.dataset.downloading = "true";
  link.style.display = "none";
  box.style.display = "block";
  fill.style.width = "0%";
  label.textContent = "0%";

  try {
    const response = await fetch(url, { method: "GET", mode: "cors" });
    if (!response.ok) throw new Error("HTTP " + response.status);

    const total = Number(response.headers.get("Content-Length")) || 0;
    if (!response.body) throw new Error("Streaming not supported");

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;

      if (total > 0) {
        const percent = Math.min(100, Math.round((received / total) * 100));
        fill.style.width = percent + "%";
        label.textContent = percent + "%";
      } else {
        label.textContent = (received / (1024 * 1024)).toFixed(1) + " MB";
      }
    }

    fill.style.width = "100%";
    label.textContent = translations[document.getElementById("language").value].completed;

    const blob = new Blob(chunks, {
      type: response.headers.get("Content-Type") || "application/octet-stream"
    });
    const objectUrl = URL.createObjectURL(blob);
    const saveLink = document.createElement("a");
    saveLink.href = objectUrl;
    saveLink.download = filename;
    document.body.appendChild(saveLink);
    saveLink.click();
    saveLink.remove();
    setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
  } catch (error) {
    console.error("Download error:", error);
    label.textContent = translations[document.getElementById("language").value].failed;
    link.dataset.downloading = "false";
    link.style.display = "block";
  }
}

document.getElementById("file1Download").addEventListener("click", event => {
  event.preventDefault();
  startDownload(1);
});
document.getElementById("file2Download").addEventListener("click", event => {
  event.preventDefault();
  startDownload(2);
});

changeLanguage("ar");
</script>
