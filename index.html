<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background:
    linear-gradient(rgba(3,8,22,.68), rgba(3,8,22,.88)),
    url("background.png") center/cover fixed;
  background-size: auto, 105% 105%;
  padding: 25px 12px;
  animation: backgroundDrift 35s ease-in-out infinite alternate;
  isolation: isolate;
}

@keyframes backgroundDrift {
  from { background-position: center, 48% 48%; }
  to { background-position: center, 52% 52%; }
}

.stars {
  position: fixed;
  inset: -100px;
  z-index: -1;
  pointer-events: none;
  opacity: .25;
  background-image:
    radial-gradient(2px 2px at 30px 40px, #fff, transparent),
    radial-gradient(1px 1px at 100px 130px, #fff, transparent),
    radial-gradient(2px 2px at 190px 80px, #54caff, transparent),
    radial-gradient(1px 1px at 250px 190px, #fff, transparent),
    radial-gradient(2px 2px at 320px 40px, #fff, transparent);
  background-size: 350px 250px;
  animation: starMove 65s linear infinite;
}

@keyframes starMove {
  from { transform: translate(0,0); }
  to { transform: translate(-100px,80px); }
}

.container {
  max-width: 430px;
  margin: auto;
  position: relative;
  z-index: 1;
}

.language-box {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 5px;
}

.language-box select {
  background: rgba(12,25,48,.9);
  color: white;
  border: 1px solid #176caa;
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 14px;
  outline: none;
}

.language-box option {
  background: #0c1930;
  color: white;
}

.logo {
  font-size: 35px;
  font-weight: 900;
  letter-spacing: 3px;
  color: #fff;
  text-shadow: 0 0 15px #00aaff;
  margin: 25px 0 8px;
}

.subtitle {
  color: #b8c9dd;
  margin-bottom: 24px;
}

/* NAVIGATION */
.navigation {
  display: flex;
  direction: rtl;
  align-items: stretch;
  width: 100%;
  gap: 3px;
  padding: 5px;
  margin: 0 0 20px;
  background: rgba(5,15,32,.92);
  border: 1px solid #176caa;
  border-radius: 13px;
  box-shadow: 0 0 12px rgba(0,145,255,.12);
}

.nav-item {
  flex: 1;
  min-width: 0;
  min-height: 68px;
  padding: 7px 2px;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  color: #c6d5e7;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-family: Arial, sans-serif;
  cursor: default;
}

.nav-item.active {
  color: white;
  background: linear-gradient(145deg, #075a9d, #06305d);
  border-color: #00aaff;
  box-shadow: 0 0 12px rgba(0,170,255,.45);
}

/* SVG ICONS */
.nav-icon {
  width: 23px;
  height: 23px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #d6eaff;
}

.nav-icon svg {
  width: 23px;
  height: 23px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-item.active .nav-icon {
  color: #ffffff;
}

.nav-label {
  font-size: 10px;
  font-weight: bold;
  white-space: nowrap;
}

.nav-soon {
  font-size: 8px;
  color: #111;
  background: #ffc52e;
  border-radius: 4px;
  padding: 2px 4px;
  font-weight: bold;
  white-space: nowrap;
}

.nav-item:disabled {
  opacity: .85;
}

/* PROGRESS */
.progress-box {
  background: rgba(12,25,48,.85);
  border: 1px solid #176caa;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 20px;
}

.progress-text {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 12px;
}

.bar {
  height: 10px;
  background: #25364b;
  border-radius: 20px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  width: 0%;
  background: #00b7ff;
  transition: width .3s;
  box-shadow: 0 0 10px #00b7ff;
}

/* AD STAGES */
.stage {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(13,29,52,.88);
  border: 1px solid #244765;
  padding: 16px;
  margin: 12px 0;
  border-radius: 13px;
  gap: 8px;
}

.stage button {
  border: 0;
  padding: 11px 14px;
  border-radius: 8px;
  color: white;
  background: #087ed0;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
}

.stage button:disabled {
  background: #28634c;
  cursor: default;
}

.stage button.locked {
  background: #344253;
  color: #b6c1ce;
  cursor: not-allowed;
}

/* PLATFORM BUTTONS */
.platform-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  margin-top: 13px;
  padding: 16px;
  border-radius: 12px;
  color: white;
  background: #26394f;
  font-size: 17px;
  font-weight: bold;
  text-decoration: none;
  border: 1px solid #40536b;
  opacity: .55;
  cursor: not-allowed;
  font-family: Arial, sans-serif;
  transition: .3s;
}

.platform-button.available {
  opacity: 1;
  cursor: pointer;
  background: linear-gradient(135deg,#087ed0,#0055a0);
  border-color: #00b7ff;
  box-shadow: 0 0 17px rgba(0,183,255,.45);
}

.platform-button.available:active {
  transform: scale(.98);
}

.platform-button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.android-icon {
  width: 29px;
  height: 29px;
  fill: #3ddc84;
  flex-shrink: 0;
}

.platform-icon {
  font-size: 25px;
  line-height: 1;
}

.soon-label {
  font-size: 11px;
  background: rgba(0,0,0,.3);
  padding: 5px 8px;
  border-radius: 6px;
}

/* STATUS */
#status {
  min-height: 25px;
  color: #ffd36a;
  margin-top: 15px;
  line-height: 1.6;
}

/* GUIDE */
.guide-box {
  background: rgba(12,25,48,.88);
  border: 1px solid #176caa;
  border-radius: 14px;
  padding: 18px;
  margin-top: 28px;
  text-align: start;
}

.guide-title {
  color: #00b7ff;
  font-size: 19px;
  font-weight: bold;
  text-align: center;
  margin: 0 0 18px;
}

.guide-step {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin: 14px 0;
  color: #d8e5f3;
  font-size: 14px;
  line-height: 1.7;
}

.step-number {

  height: 27px;
  border-radius: 50%;
  background: #087ed0;
  color: white;
  font-weight: bold;
  font-size: 13px;
}

.guide-note {
  color: #35ef91;
  text-align: center;
  font-weight: bold;
  font-size: 14px;
  line-height: 1.7;
  margin-top: 18px;
}

footer {

  color: #879bb2;
  font-size: 12px;
}

@media (max-width: 360px) {
  .nav-item { min-height: 62px; }
  .nav-icon, .nav-icon svg {

    height: 20px;

  .nav-label { font-size: 9px; }
  .nav-soon { font-size: 7px; }
  .navigation { gap: 1px; padding: 3px; }
}

@media (prefers-reduced-motion: reduce) {
  body, .stars { animation: none; }
}
</style>

function t(key) {
  return translations[currentLanguage][key];
}

function clearActiveSession() {
  localStorage.removeItem(LOCK_KEY);

  if (activePopup && !activePopup.closed) {
    try {
      activePopup.close();
    } catch {}
  }

  activePopup = null;
}

function getActiveSession() {
  try {
    const raw = localStorage.getItem(LOCK_KEY);
    if (!raw) return null;

    const session = JSON.parse(raw);
    const startedAt = Number(session.startedAt);

    if (
      !session ||
      !Number.isFinite(startedAt) ||
      startedAt > Date.now() ||
      Date.now() - startedAt >= LOCK_DURATION
    ) {
      clearActiveSession();
      return null;
    }

    return session;
  } catch {
    clearActiveSession();
    return null;
  }
}

function saveActiveSession(number) {
  localStorage.setItem(LOCK_KEY, JSON.stringify({
    stage: number,
    startedAt: Date.now()
  }));
}

function renderGuide() {
  const language = translations[currentLanguage];

  document.getElementById("guideTitle").textContent =
    language.guideTitle;

  const container = document.getElementById("guideSteps");
  container.innerHTML = "";

  language.guideSteps.forEach((step, index) => {
    const row = document.createElement("div");
    row.className = "guide-step";

    const number = document.createElement("span");
    number.className = "step-number";
    number.textContent = index + 1;

    const text = document.createElement("span");
    text.textContent = step;

    row.appendChild(number);
    row.appendChild(text);
    container.appendChild(row);
  });

  document.getElementById("guideNote").textContent =
    language.guideNote;
}

function createStages() {
  stages.innerHTML = "";

  for (let i = 1; i <= REQUIRED; i++) {
    const item = document.createElement("div");
    item.className = "stage";

    const label = document.createElement("span");
    label.id = "label" + i;

    const button = document.createElement("button");
    button.id = "btn" + i;
    button.onclick = () => watchAd(i);

    item.appendChild(label);
    item.appendChild(button);
    stages.appendChild(item);
  }

  updateProgress(progress);
}

function changeLanguage(language) {
  if (!translations[language]) return;

  currentLanguage = language;

  document.documentElement.lang = language;
  document.documentElement.dir =
    language === "ar" ? "rtl" : "ltr";

  document.getElementById("progressLabel").textContent = t("progress");
  document.getElementById("androidText").textContent = t("android");
  document.getElementById("iphoneText").textContent = t("iphone");
  document.getElementById("betaText").textContent = t("beta");

  document.getElementById("navHome").textContent = t("home");
  document.getElementById("navRewards").textContent = t("rewards");
  document.getElementById("navReferral").textContent = t("referral");
  document.getElementById("navNews").textContent = t("news");

  [
    "soon1", "soon2", "soon3", "soon4",
    "iphoneSoon", "betaSoon"
  ].forEach(id => {
    document.getElementById(id).textContent = t("soon");
  });

  renderGuide();
  createStages();

  if (progress >= REQUIRED) {
    statusBox.textContent = t("complete");
  }
}

function updatePlatforms() {
  const download = document.getElementById("download");
  const iphone = document.getElementById("iphoneButton");
  const beta = document.getElementById("betaButton");

  const androidReady = progress >= REQUIRED;

  download.classList.toggle("available", androidReady);
  download.href = androidReady ? DOWNLOAD_PAGE : "#";
  download.setAttribute("aria-disabled", String(!androidReady));

  iphone.disabled = !PLATFORM_AVAILABILITY.iphone;
  iphone.classList.toggle("available", PLATFORM_AVAILABILITY.iphone);

  beta.disabled = !PLATFORM_AVAILABILITY.beta;
  beta.classList.toggle("available", PLATFORM_AVAILABILITY.beta);
}

function updateProgress(value) {
  progress = Math.max(
    0,
    Math.min(REQUIRED, Number(value) || 0)
  );

  document.getElementById("count").textContent =
    progress + "/" + REQUIRED;

  document.getElementById("bar").style.width =
    (progress / REQUIRED * 100) + "%";

  for (let i = 1; i <= REQUIRED; i++) {
    const button = document.getElementById("btn" + i);
    const label = document.getElementById("label" + i);

    if (!button || !label) continue;

    label.textContent =
      t("stage") + " " + i + "/" + REQUIRED;

    if (i <= progress) {
      button.textContent = "✓ " + t("completed");
      button.disabled = true;
      button.className = "";
    } else if (i === progress + 1) {
      button.textContent = t("watch");
      button.disabled = false;
      button.className = "";
    } else {
      button.textContent = "🔒 " + t("locked");
      button.disabled = true;
      button.className = "locked";
    }
  }

  updatePlatforms();
}

async function refreshProgress() {
  try {
    const response = await fetch("/api/progress", {
      method: "GET",
      cache: "no-store",
      credentials: "same-origin"
    });

    if (!response.ok) {
      throw new Error("Progress request failed");
    }

    const data = await response.json();

    if (!data || !Number.isFinite(Number(data.progress))) {
      throw new Error("Invalid progress response");
    }

    const newProgress = Math.max(
      0,
      Math.min(REQUIRED, Number(data.progress))
    );

    const session = getActiveSession();

    if (
      session &&
      Number(session.stage) <= newProgress
    ) {
      clearActiveSession();

      if (newProgress < REQUIRED) {
        statusBox.textContent = t("confirmed");
      }
    } else if (
      lastProgress !== null &&
      newProgress > lastProgress
    ) {
      clearActiveSession();

      if (newProgress < REQUIRED) {
        statusBox.textContent = t("confirmed");
      }
    }

    lastProgress = newProgress;
    updateProgress(newProgress);

    if (newProgress >= REQUIRED) {
      statusBox.textContent = t("complete");
    }

  } catch (error) {
    statusBox.textContent = t("refreshError");
  }
}

async function watchAd(number) {
  if (MAINTENANCE_MODE || busy) return;
  if (number !== progress + 1) return;

  const existingSession = getActiveSession();

  if (existingSession) {
    statusBox.textContent = t("session");
    return;
  }

  const popup = window.open("about:blank", "_blank");

  if (!popup) {
    statusBox.textContent = t("popup");
    return;
  }

  busy = true;
  activePopup = popup;

  saveActiveSession(number);
  statusBox.textContent = t("searching");

  try {
    const response = await fetch("/api/ptc", {
      method: "GET",
      cache: "no-store",
      credentials: "same-origin"
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || t("error"));
    }

    const ads = Array.isArray(data.ads) ? data.ads : [];

    const validAds = ads.filter(ad => {
      const type = Number(ad.type);
      const duration = Number(ad.duration);

      return (
        [0, 1].includes(type) &&
        Number.isFinite(duration) &&
        duration > 0 &&
        typeof ad.url === "string" &&
        ad.url.startsWith("https://")
      );
    });

    if (validAds.length === 0) {
      throw new Error(t("noAd"));
    }

    const ad = validAds[
      Math.floor(Math.random() * validAds.length)
    ];

    if (popup.closed) {
      throw new Error(t("popup"));
    }

    popup.location.href = ad.url;

    const typeName = Number(ad.type) === 0
      ? "iFrame / Video"
      : "Window";

    statusBox.textContent =
      t("opened") + " " +
      (ad.title || "PTC Ad") +
      " (" + typeName + ") — " +
      ad.duration + " " + t("seconds");

  } catch (error) {
    if (popup && !popup.closed) {
      popup.close();
    }

    clearActiveSession();
    statusBox.textContent = error.message || t("error");

  } finally {
    busy = false;
    await refreshProgress();
  }
}

/* INITIALIZATION */
getActiveSession();
createStages();
changeLanguage("ar");
refreshProgress();

setInterval(refreshProgress, 5000);

window.addEventListener("focus", refreshProgress);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    refreshProgress();
  }
});

window.addEventListener("pageshow", () => {
  getActiveSession();
  refreshProgress();
});
</script>
