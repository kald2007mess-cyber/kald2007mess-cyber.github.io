
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OXIDE HUB</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      background:
        linear-gradient(rgba(3,8,22,.68), rgba(3,8,22,.88)),
        url("background.png") center/cover fixed;
      padding: 25px 15px;
    }

    .container {
      max-width: 430px;
      margin: auto;
    }

    .logo {
      font-size: 35px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 0 15px #00aaff;
      margin: 25px 0 8px;
    }

    .subtitle {
      color: #b8c9dd;
      margin-bottom: 28px;
    }

    .progress-box {
      background: rgba(12, 25, 48, .85);
      border: 1px solid #176caa;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .progress-text {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .bar {
      height: 10px;
      background: #25364b;
      border-radius: 20px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #00b7ff;
      transition: width .3s;
    }

    .stage {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(13, 29, 52, .88);
      border: 1px solid #244765;
      padding: 16px;
      margin: 12px 0;
      border-radius: 13px;
    }

    .stage button {
      border: 0;
      padding: 11px 18px;
      border-radius: 8px;
      color: white;
      background: #087ed0;
      font-weight: bold;
      cursor: pointer;
    }

    .stage button:disabled {
      background: #28634c;
      cursor: default;
    }

    .check {
      color: #35ef91;
      font-size: 23px;
      margin-right: 8px;
    }

    #download {
      display: block;
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border-radius: 12px;
      color: white;
      background: #087ed0;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      opacity: .4;
      pointer-events: none;
    }

    #download.ready {
      opacity: 1;
      pointer-events: auto;
    }

    #status {
      min-height: 25px;
      color: #ffd36a;
      margin-top: 15px;
    }

    footer {
      margin-top: 35px;
      color: #879bb2;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">OXIDE HUB</div>
    <div class="subtitle">SURVIVE • EXPLORE • DOMINATE</div>

    <section class="progress-box">
      <div class="progress-text">
        Progress: <span id="count">0/5</span>
      </div>
      <div class="bar">
        <div class="bar-fill" id="bar"></div>
      </div>
    </section>

    <div id="stages"></div>

    <a id="download" href="#" aria-disabled="true">
      DOWNLOAD
    </a>

    <div id="status" role="status"></div>

    <footer>OXIDE HUB © 2026<br>Created by SKIMI_17</footer>
  </main>

  <script>
    const stages = document.getElementById("stages");
    const statusBox = document.getElementById("status");

    let progress = 0;
    let busy = false;

    for (let i = 1; i <= 5; i++) {
      const item = document.createElement("div");
      item.className = "stage";

      item.innerHTML = `
        <span>
          المرحلة ${i}/5
          <span class="check" id="check${i}"></span>
        </span>
        <button id="btn${i}" onclick="watchAd(${i})">
          WATCH AD
        </button>
      `;

      stages.appendChild(item);
    }

    function updateProgress(value) {
      progress = Math.max(0, Math.min(5, Number(value) || 0));

      document.getElementById("count").textContent =
        progress + "/5";

      document.getElementById("bar").style.width =
        (progress * 20) + "%";

      for (let i = 1; i <= 5; i++) {
        const button = document.getElementById("btn" + i);
        const check = document.getElementById("check" + i);

        if (i <= progress) {
          button.textContent = "COMPLETED";
          button.disabled = true;
          check.textContent = "✓";
        } else {
          button.textContent = "WATCH AD";
          button.disabled = false;
          check.textContent = "";
        }
      }

      if (progress === 5) {
        statusBox.textContent =
          "اكتملت المراحل الخمس! التحميل غير مجهز بعد.";
      }
    }

    async function refreshProgress() {
      try {
        const response = await fetch("/api/progress", {
          method: "GET",
          cache: "no-store",
          credentials: "same-origin"
        });

        if (!response.ok) {
          throw new Error("Progress request failed");
        }

        const data = await response.json();
        updateProgress(data.progress);

      } catch (error) {
        statusBox.textContent =
          "تعذر تحديث التقدم. أعد تحميل الصفحة.";
      }
    }

    async function watchAd(number) {
      if (busy || number <= progress) return;

      const popup = window.open("about:blank", "_blank");

      if (!popup) {
        statusBox.textContent =
          "اسمح بفتح النوافذ المنبثقة للمتابعة.";
        return;
      }

      try {
        busy = true;
        statusBox.textContent = "جاري فتح Offerwall...";

        const response = await fetch("/api/offerwall", {
          method: "GET",
          cache: "no-store",
          credentials: "same-origin"
        });

        const data = await response.json();

        if (!response.ok || !data.url) {
          throw new Error(
            data.error || "تعذر إنشاء رابط المهام"
          );
        }

        popup.location.href = data.url;

        statusBox.textContent =
          "أكمل المهام وانتظر تأكيد المكافأة.";

      } catch (error) {
        popup.close();

        statusBox.textContent =
          error.message || "حدث خطأ. حاول مرة أخرى.";

      } finally {
        busy = false;
        refreshProgress();
      }
    }

    refreshProgress();

    setInterval(refreshProgress, 5000);

    window.addEventListener("focus", refreshProgress);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refreshProgress();
    });
  </script>
</body>
</html>
