
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OXIDE HUB 2027</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;
  background:
  linear-gradient(180deg,rgba(3,8,18,.78),rgba(3,8,18,.96)),
  url("background.png") center/cover fixed;
}

header{
  text-align:center;
  padding:45px 15px 25px;
}

.logo{
  direction:ltr;
  font-size:48px;
  font-weight:1000;
  letter-spacing:5px;
  font-style:italic;
  text-shadow:0 3px 0 #333,0 0 20px #ff6b27;
}

.logo span{color:#ff702c}

.tag{
  color:#aebbd0;
  letter-spacing:4px;
  font-size:11px;
  margin-top:10px;
}

.container{
  max-width:520px;
  margin:25px auto;
  padding:15px;
}

.panel{
  background:rgba(7,15,29,.88);
  border:1px solid #34465d;
  border-radius:15px;
  padding:24px 18px;
  box-shadow:0 10px 40px #0009;
}

h2{
  text-align:center;
  font-size:20px;
  margin-bottom:10px;
}

.description{
  text-align:center;
  color:#aab7c9;
  font-size:13px;
  margin-bottom:25px;
}

.progress{
  display:flex;
  gap:7px;
  direction:ltr;
  margin-bottom:25px;
}

.segment{
  height:7px;
  flex:1;
  border-radius:10px;
  background:#29394c;
}

.segment.active{background:#ff762e}

.stage{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  margin:10px 0;
  border:1px solid #263a50;
  background:#101e30;
  border-radius:10px;
}

.stage strong{font-size:14px}
.stage small{color:#8295aa}

.stage button{
  border:1px solid #ff762e;
  background:#382316;
  color:#ff9b5d;
  padding:9px 13px;
  border-radius:7px;
  font-weight:bold;
}

.download{
  display:block;
  width:100%;
  margin-top:25px;
  padding:17px;
  border:0;
  border-radius:10px;
  background:#087cf0;
  color:white;
  font-size:18px;
  font-weight:bold;
  text-align:center;
  text-decoration:none;
  box-shadow:0 0 22px #087cf055;
}

.download.disabled{
  opacity:.45;
  pointer-events:none;
}

footer{
  text-align:center;
  padding:30px;
  color:#77869a;
  font-size:11px;
}
</style>
</head>

<body>

<header>
  <div class="logo">OXIDE <span>HUB</span></div>
  <div class="tag">SURVIVE • EXPLORE • DISCOVER</div>
</header>

<div class="container">
  <section class="panel">

    <h2>مركز تحميل اللعبة</h2>
    <p class="description">
      أكمل المراحل المطلوبة للوصول إلى التحميل
    </p>

    <div class="progress">
      <div class="segment"></div>
      <div class="segment"></div>
      <div class="segment"></div>
      <div class="segment"></div>
      <div class="segment"></div>
    </div>

    <div id="stages"></div>

    <a class="download disabled" id="download" href="#">
      🔒 تنزيل الملف
    </a>

  </section>
</div>

<footer>
  OXIDE HUB © 2027<br>
  CREATED BY SKIMI_17
</footer>

<script>
const stages = document.getElementById("stages");

for(let i=1;i<=5;i++){
  stages.innerHTML += `
    <div class="stage">
      <div>
        <strong>المرحلة ${i}/5</strong><br>
        <small>بانتظار ربط نظام الإعلانات</small>
      </div>
      <button onclick="alert('سيتم ربط الإعلان الحقيقي بهذه المرحلة لاحقاً')">
        مشاهدة الإعلان
      </button>
    </div>
  `;
}
</script>

</body>
</html>
