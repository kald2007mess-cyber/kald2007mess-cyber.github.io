
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OXIDE HUB</title>

  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      background:
        linear-gradient(rgba(3,8,22,.68), rgba(3,8,22,.88)),
        url("background.png") center/cover fixed;
      padding: 25px 15px;
    }

    .container {
      max-width: 430px;
      margin: auto;
    }

    .logo {
      font-size: 35px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 0 15px #00aaff;
      margin: 25px 0 8px;
    }

    .subtitle {
      color: #b8c9dd;
      margin-bottom: 28px;
    }

    .progress-box {
      background: rgba(12, 25, 48, .85);
      border: 1px solid #176caa;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .progress-text {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .bar {
      height: 10px;
      background: #25364b;
      border-radius: 20px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #00b7ff;
      transition: width .3s;
    }

    .stage {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(13, 29, 52, .88);
      border: 1px solid #244765;
      padding: 16px;
      margin: 12px 0;
      border-radius: 13px;
    }

    .stage button {
      border: 0;
      padding: 11px 18px;
      border-radius: 8px;
      color: white;
      background: #087ed0;
      font-weight: bold;
      cursor: pointer;
    }

    .stage button:disabled {
      background: #28634c;
      cursor: default;
    }

    .check {
      color: #35ef91;
      font-size: 23px;
      margin-right: 8px;
    }

    #download {
      display: block;
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border-radius: 12px;
      color: white;
      background: #087ed0;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      opacity: .4;
      pointer-events: none;
    }

    #download.ready {
      opacity: 1;
      pointer-events: auto;
    }

    #status {
      min-height: 25px;
      color: #ffd36a;
      margin-top: 15px;
    }

    footer {
      margin-top: 35px;
      color: #879bb2;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">OXIDE HUB</div>
    <div class="subtitle">SURVIVE • EXPLORE • DOMINATE</div>

    <section class="progress-box">
      <div class="progress-text">
        Progress: <span id="count">0/5</span>
      </div>
      <div class="bar">
        <div class="bar-fill" id="bar"></div>
      </div>
    </section>

    <div id="stages"></div>

    <a id="download" href="#" target="_blank" rel="noopener">
      DOWNLOAD
    </a>

    <div id="status" role="status"></div>

    <footer>OXIDE HUB © 2026<br>Created by SKIMI_17</footer>
  </main>

  <script>
    const BLOCK_ID = "58793";

    // ضع رابط ملف التحميل الحقيقي هنا بعد تجهيزه
    const DOWNLOAD_URL = "";

    const stages = document.getElementById("stages");
    const statusBox = document.getElementById("status");
    const completed = new Set();
    let adController = null;
    let busy = false;

    for (let i = 1; i <= 5; i++) {
      const item = document.createElement("div");
      item.className = "stage";
      item.innerHTML = `
        <span>المرحلة ${i}/5 <span class="check" id="check${i}"></span></span>
        <button id="btn${i}" onclick="watchAd(${i})">
          WATCH AD
        </button>
      `;
      stages.appendChild(item);
    }

    function updateProgress() {
      const total = completed.size;
      document.getElementById("count").textContent = total + "/5";
      document.getElementById("bar").style.width =
        (total * 20) + "%";

      if (total === 5) {
        const download = document.getElementById("download");

        if (DOWNLOAD_URL) {
          download.href = DOWNLOAD_URL;
          download.classList.add("ready");
          statusBox.textContent = "All stages completed!";
        } else {
          statusBox.textContent =
            "اكتملت المراحل الخمس. رابط التحميل لم يُضف بعد.";
        }
      }
    }

    async function watchAd(number) {
      if (completed.has(number) || busy) return;

      if (!window.Adsgram) {
        statusBox.textContent = "تعذر تحميل مكتبة الإعلانات.";
        return;
      }

      try {
        busy = true;
        statusBox.textContent = "جاري تحميل الإعلان...";

        if (!adController) {
          adController = window.Adsgram.init({
            blockId: BLOCK_ID
          });
        }

        const result = await adController.show();

        if (result && result.done === true && !result.error) {
          completed.add(number);
          document.getElementById("check" + number).textContent = "✓";

          const button = document.getElementById("btn" + number);
          button.textContent = "COMPLETED";
          button.disabled = true;

          statusBox.textContent = "تم إكمال المرحلة بنجاح!";
          updateProgress();
        } else {
          statusBox.textContent = "لم يكتمل الإعلان، حاول مرة أخرى.";
        }
      } catch (error) {
        statusBox.textContent = "تعذر عرض الإعلان. حاول لاحقاً.";
      } finally {
        busy = false;
      }
    }
  </script>
</body>
</html>
