function readOxideList(key){try{const value=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(value)?value:[]}catch(error){return []}}
function writeOxideList(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(error){}}
function updateOxideBadge(id,count,limit=99,overflowText="99+"){const badge=document.getElementById(id);if(!badge)return;const n=Math.max(0,Number(count)||0);badge.textContent=n>limit?overflowText:String(n);badge.style.display=n?"inline-flex":"none"}
function markSupportMessagesSeen(){supportSeenAdminId=Math.max(supportSeenAdminId,lastSupportMessageId);try{localStorage.setItem("oxide_support_seen_admin_id",String(supportSeenAdminId))}catch(error){}supportUnreadAdminIds=[];updateOxideBadge("supportUnreadBadge",0)}
function trackSupportMessages(messages,initial){const adminIds=messages.filter(m=>m.sender==="admin"||m.sender==="support").map(m=>Number(m.id)||0).filter(id=>id>0);const maxAdminId=adminIds.length?Math.max(...adminIds):0;let stored=null;try{stored=localStorage.getItem("oxide_support_seen_admin_id")}catch(error){}if(stored===null&&!supportSeenInitialized){supportSeenAdminId=0;supportSeenInitialized=true;try{localStorage.setItem("oxide_support_seen_admin_id","0")}catch(error){}}else{supportSeenInitialized=true;supportSeenAdminId=Math.max(supportSeenAdminId,Number(stored)||0)}const supportOpen=document.getElementById("supportPage")?.style.display==="block";if(supportOpen){supportSeenAdminId=Math.max(supportSeenAdminId,maxAdminId);try{localStorage.setItem("oxide_support_seen_admin_id",String(supportSeenAdminId))}catch(error){}supportUnreadAdminIds=[];updateOxideBadge("supportUnreadBadge",0)}else{const unreadCount=adminIds.filter(id=>id>supportSeenAdminId).length;updateOxideBadge("supportUnreadBadge",unreadCount)}}
let newsSeenInitialized=false,newsSeenIds=readOxideList("oxide_news_seen_ids").map(String),newsUnreadIds=[];
function trackNewsPosts(posts,markSeen=false){const ids=posts.map(p=>String(p.id));let stored=null;try{stored=localStorage.getItem("oxide_news_seen_ids")}catch(error){}if(stored===null&&!newsSeenInitialized){newsSeenIds=ids;newsSeenInitialized=true;writeOxideList("oxide_news_seen_ids",newsSeenIds)}else{newsSeenInitialized=true;for(const id of ids){if(!newsSeenIds.includes(id)&&!newsUnreadIds.includes(id))newsUnreadIds.push(id)}}if(markSeen){newsSeenIds=[...new Set([...newsSeenIds,...ids])];newsUnreadIds=[];writeOxideList("oxide_news_seen_ids",newsSeenIds)}updateOxideBadge("newsUnreadBadge",newsUnreadIds.length)}
let missionsSeenInitialized=false,missionsSeenIds=readOxideList("oxide_missions_seen_ids").map(String),missionsUnreadIds=[];
function trackMissionItems(items,markSeen=false){const ids=items.map(m=>String(m.id));let stored=null;try{stored=localStorage.getItem("oxide_missions_seen_ids")}catch(error){}if(stored===null&&!missionsSeenInitialized){missionsSeenIds=ids;missionsSeenInitialized=true;writeOxideList("oxide_missions_seen_ids",missionsSeenIds)}else{missionsSeenInitialized=true;for(const id of ids){if(!missionsSeenIds.includes(id)&&!missionsUnreadIds.includes(id))missionsUnreadIds.push(id)}}if(markSeen){missionsSeenIds=[...new Set([...missionsSeenIds,...ids])];missionsUnreadIds=[];writeOxideList("oxide_missions_seen_ids",missionsSeenIds)}updateOxideBadge("missionsUnreadBadge",missionsUnreadIds.length)}

/* OXIDE HUB notification center */
let oxideNotifications=[],notificationsOpen=false,notificationsBusy=false;
async function loadNotifications(openPanel=false){
 if(notificationsBusy)return;notificationsBusy=true;
 const list=document.getElementById("notificationsList");
 try{
  const response=await fetch("/api/notifications",{method:"GET",cache:"no-store",credentials:"same-origin"});
  const data=await response.json();if(!response.ok||!data.success)throw new Error(data.error||"NOTIFICATIONS_FAILED");
  oxideNotifications=Array.isArray(data.notifications)?data.notifications:[];
  const unread=oxideNotifications.filter(n=>!n.read_at).length;
  const badge=document.getElementById("notificationCount");
  if(badge){badge.textContent="";badge.style.display=unread?"block":"none";badge.setAttribute("aria-label",unread?"إشعارات غير مقروءة":"لا توجد إشعارات غير مقروءة")}const deleteButton=document.getElementById("deleteReadNotificationsButton");if(deleteButton)deleteButton.disabled=!oxideNotifications.some(n=>Boolean(n.read_at));
  if(!list)return;
  if(!oxideNotifications.length){list.innerHTML='<div class="notification-empty">لا توجد إشعارات حتى الآن.</div>';return}
  list.replaceChildren();
  oxideNotifications.forEach(n=>{
   const card=document.createElement("article");card.className="notification-item"+(!n.read_at?" unread":"");
   const title=document.createElement("div");title.className="notification-title";title.textContent=String(n.title||"إشعار");
   const body=document.createElement("div");body.className="notification-body";body.textContent=String(n.body||"");
   const meta=document.createElement("div");meta.className="notification-meta";meta.textContent=new Date(Number(n.created_at||0)*1000).toLocaleString();
   card.append(title,body,meta);
   if(n.type==="reward"&&Number(n.reward_points)>0){
    const button=document.createElement("button");button.className="notification-claim";
    button.textContent=n.claimed_at?"تم الاستلام ✓":"🎁 استلم "+Number(n.reward_points).toLocaleString()+" نقطة";
    button.disabled=Boolean(n.claimed_at);if(!n.claimed_at)button.addEventListener("click",()=>claimNotification(Number(n.id),button));
    card.appendChild(button);
   }
   list.appendChild(card);
  });
  if(openPanel){
   document.getElementById("notificationsPanel").hidden=false;
   await fetch("/api/notifications",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({action:"read_all"})});
   oxideNotifications.forEach(n=>n.read_at=n.read_at||Math.floor(Date.now()/1000));
   list.querySelectorAll(".notification-item").forEach(card=>card.classList.remove("unread"));
   const badge=document.getElementById("notificationCount");if(badge){badge.textContent="";badge.style.display="none"}const deleteButton=document.getElementById("deleteReadNotificationsButton");if(deleteButton)deleteButton.disabled=!oxideNotifications.some(n=>Boolean(n.read_at));
  }
 }catch(error){if(list)list.innerHTML='<div class="notification-empty">تعذر تحميل الإشعارات. حاول مجددًا.</div>'}
 finally{notificationsBusy=false}
}
async function toggleNotifications(){
 const panel=document.getElementById("notificationsPanel");if(!panel)return;
 if(!panel.hidden){panel.hidden=true;notificationsOpen=false;return}
 notificationsOpen=true;panel.hidden=false;await loadNotifications(true);
}
function closeNotifications(){const panel=document.getElementById("notificationsPanel");if(panel)panel.hidden=true;notificationsOpen=false}
async function deleteReadNotifications(){const count=oxideNotifications.filter(n=>Boolean(n.read_at)).length;if(!count)return;if(!confirm("حذف جميع الإشعارات المقروءة فقط؟ لن تُحذف الإشعارات غير المقروءة."))return;const button=document.getElementById("deleteReadNotificationsButton");if(button)button.disabled=true;try{const response=await fetch("/api/notifications",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({action:"delete_read"})});const data=await response.json();if(!response.ok||!data.success)throw new Error("DELETE_FAILED");await loadNotifications(false)}catch(error){alert("تعذر حذف الإشعارات المقروءة. حاول مجددًا.");if(button)button.disabled=false}}

async function claimNotification(id,button){
 if(button.disabled)return;button.disabled=true;button.textContent="جارٍ استلام المكافأة...";
 try{
  const response=await fetch("/api/notifications",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({action:"claim",id})});
  const data=await response.json();if(!response.ok||!data.success)throw new Error(data.error||"CLAIM_FAILED");
  button.textContent="تم الاستلام ✓";
  const balance=document.getElementById("missionsBalance");if(balance&&Number.isFinite(Number(data.balance)))balance.textContent=Number(data.balance).toLocaleString();
  await loadNotifications(true);
  alert("🎉 تمت إضافة "+Number(data.pointsAwarded||0)+" نقطة إلى رصيدك!");
 }catch(error){button.disabled=false;button.textContent="حاول الاستلام مجددًا";alert(error.message==="ALREADY_CLAIMED_OR_NOT_FOUND"?"تم استلام هذه المكافأة مسبقًا أو لم تعد متاحة.":"تعذر استلام المكافأة. حاول مجددًا.");}
}

function updateMissionProgress(completed, total){
  const safeTotal = Math.max(0, Number(total) || 0);
  const safeCompleted = Math.max(0, Math.min(safeTotal, Number(completed) || 0));
  const percent = safeTotal ? Math.round((safeCompleted / safeTotal) * 100) : 0;

  const number = document.getElementById("missionProgressNumber");
  const fill = document.getElementById("missionProgressFill");
  const percentLabel = document.getElementById("missionProgressPercent");
  const remaining = document.getElementById("missionRemaining");

  if(number) number.textContent = safeCompleted + " / " + safeTotal;
  if(fill) fill.style.width = percent + "%";
  if(percentLabel) percentLabel.textContent = percent + "% " + mt("percent");
  if(remaining) remaining.textContent = Math.max(0, safeTotal - safeCompleted) + " " + mt("remainingSuffix");

  const completedNode = document.getElementById("completedMissionsCount");
  if(completedNode) completedNode.textContent = safeCompleted + "/" + safeTotal;

  const countNode = document.getElementById("missionListCount");
  if(countNode) countNode.textContent = safeTotal ? ("01 — " + String(safeTotal).padStart(2, "0")) : "00";
}

function renderMissionCards(){
  const list = document.getElementById("missionList");
  if(!list) return;

  const ui = missionUiLabels();
  clearMissionPreviewUrls();
  list.replaceChildren();

  if(!missionData.length){
    const empty = document.createElement("div");
    empty.className = "mission-item";
    const text = document.createElement("div");
    text.className = "mission-description";
    text.textContent = ui.noMissions;
    empty.appendChild(text);
    list.appendChild(empty);
    return;
  }

  missionData.forEach(mission => {
    const id = Number(mission.id);
    const status = String(mission.status || "not_submitted");
    const card = document.createElement("article");
    card.className = "mission-item";
    card.dataset.missionId = String(id);

    const main = document.createElement("div");
    main.className = "mission-item-main";

    const heading = document.createElement("div");
    heading.className = "mission-item-heading";

    const icon = document.createElement("div");
    icon.className = "mission-item-icon";
    icon.appendChild(missionPlatformIcon(mission.platform));

    const headingText = document.createElement("div");
    const title = document.createElement("div");
    title.className = "mission-item-title";
    title.textContent = String(mission.title || ("Mission #" + id));

    const meta = document.createElement("div");
    meta.className = "mission-item-meta";
    meta.textContent = String(mission.platform || "MISSION").toUpperCase() +
      " · MISSION #" + String(id).padStart(2, "0");

    headingText.append(title, meta);
    heading.append(icon, headingText);

    const pill = document.createElement("span");
    pill.className = "mission-status-pill";
    if(status === "approved"){
      pill.classList.add("approved");
      pill.textContent = mt("approved");
    }else if(status === "pending"){
      pill.classList.add("pending");
      pill.textContent = mt("pending");
    }else if(status === "rejected"){
      pill.classList.add("rejected");
      pill.textContent = mt("rejected");
    }else{
      pill.textContent = mt("availableStatus");
    }

    main.append(heading, pill);
    card.appendChild(main);

    if(mission.description){
      const description = document.createElement("div");
      description.className = "mission-description";
      description.textContent = String(mission.description);
      card.appendChild(description);
    }

    const rewardRow = document.createElement("div");
    rewardRow.className = "mission-reward-row";
    const rewardLabel = document.createElement("span");
    rewardLabel.textContent = ui.reward;
    const rewardValue = document.createElement("span");
    rewardValue.className = "mission-reward";
    rewardValue.textContent = "+" + Number(mission.rewardPoints || 0).toLocaleString() + " PTS";
    rewardRow.append(rewardLabel, rewardValue);
    card.appendChild(rewardRow);

    const targetUrl = String(mission.targetUrl || "");
    if(/^https:\/\/[^\s]+$/i.test(targetUrl)){
      const link = document.createElement("a");
      link.className = "mission-link-button";
      link.href = targetUrl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = ui.open;
      card.appendChild(link);
    }

    const message = document.createElement("div");
    message.className = "mission-message";
    message.setAttribute("role", "status");

    if(status === "approved"){
      message.textContent = ui.approvedMessage;
      card.appendChild(message);
      list.appendChild(card);
      return;
    }

    if(status === "pending"){
      message.textContent = ui.pendingMessage;
    }else if(status === "rejected"){
      message.textContent = ui.rejectedMessage;
    }

    const form = document.createElement("form");
    form.className = "mission-proof-box";

    const label = document.createElement("label");
    label.className = "mission-file-label";
    label.htmlFor = "missionProof-" + id;
    label.textContent = "▧ " + ui.proof;

    const input = document.createElement("input");
    input.className = "mission-file-input";
    input.id = "missionProof-" + id;
    input.name = "proof";
    input.type = "file";
    input.accept = "image/*";
    input.required = true;
    input.disabled = status === "pending";

    const uploadHint = document.createElement("div");
    uploadHint.className = "mission-upload-hint";
    uploadHint.textContent = ui.uploadHint || "Choose a clear image · Maximum size 8 MB";

    const preview = document.createElement("div");
    preview.className = "mission-preview";
    preview.setAttribute("aria-live", "polite");
    const previewHeading = document.createElement("div");
    previewHeading.className = "mission-preview-heading";
    previewHeading.textContent = "▣ " + mt("preview");
    const previewImage = document.createElement("img");
    previewImage.className = "mission-preview-image";
    previewImage.alt = mt("selected");
    const previewInfo = document.createElement("div");
    previewInfo.className = "mission-preview-info";
    preview.append(previewHeading, previewImage, previewInfo);

    input.addEventListener("change",()=>{
      if(previewImage.dataset.objectUrl){
        try{URL.revokeObjectURL(previewImage.dataset.objectUrl)}catch(error){}
        missionPreviewUrls=missionPreviewUrls.filter(url=>url!==previewImage.dataset.objectUrl);
        delete previewImage.dataset.objectUrl;
      }
      const selected=input.files&&input.files[0];
      if(!selected){preview.classList.remove("visible");previewImage.removeAttribute("src");previewInfo.textContent="";return;}
      if(!selected.type.startsWith("image/")||selected.size<=0||selected.size>8*1024*1024){
        preview.classList.remove("visible");previewImage.removeAttribute("src");previewInfo.textContent="";
        if(message)message.textContent=mt("invalid");
        return;
      }
      const objectUrl=URL.createObjectURL(selected);
      previewImage.src=objectUrl;
      previewImage.dataset.objectUrl=objectUrl;
      missionPreviewUrls.push(objectUrl);
      previewInfo.textContent=mt("selected")+" · "+selected.name+" · "+(selected.size/1024/1024).toFixed(2)+" MB";
      preview.classList.add("visible");
      if(message)message.textContent="";
    });

    const button = document.createElement("button");
    button.className = "mission-submit-button";
    button.type = "submit";
    button.textContent = status === "pending" ? mt("pending") : ui.submit;
    button.disabled = status === "pending" || missionSubmittingId === id;

    form.append(label, input, uploadHint, preview, button);
    form.addEventListener("submit", event => submitMissionProof(event, id));

    card.append(form, message);
    list.appendChild(card);
  });
}

async function loadMissionStatus(){
  const list = document.getElementById("missionList");

  try{
    const response = await fetch("/api/missions/status", {
      method:"GET",
      cache:"no-store",
      credentials:"same-origin"
    });

    const data = await response.json();
    if(!response.ok || !data.success){
      throw new Error(data.error || "STATUS_FAILED");
    }

    const points = Number(data.points || 0);
    const balance = document.getElementById("missionsBalance");
    if(balance) balance.textContent = points.toLocaleString();

    missionData = Array.isArray(data.missions) ? data.missions : [];
    trackMissionItems(missionData,document.getElementById("islandTasksPanel").style.display!=="none");

    const completed = missionData.filter(item => item.status === "approved").length;
    updateMissionProgress(completed, missionData.length);
    renderMissionCards();

  }catch(error){
    if(list){
      list.replaceChildren();
      const message = document.createElement("div");
      message.className = "mission-message";
      message.textContent = mt("statusError");
      list.appendChild(message);
    }
  }
}

async function submitMissionProof(event, missionId){
  event.preventDefault();

  const id = Number(missionId);
  if(missionSubmittingId !== null) return;

  const form = event.currentTarget;
  const input = form.querySelector('input[type="file"]');
  const button = form.querySelector('button[type="submit"]');
  const card = form.closest(".mission-item");
  const message = card ? card.querySelector(".mission-message") : null;
  const file = input && input.files && input.files[0];

  if(!file){
    if(message) message.textContent = mt("choose");
    return;
  }

  if(!file.type.startsWith("image/") || file.size <= 0 || file.size > 8 * 1024 * 1024){
    if(message) message.textContent = mt("invalid");
    return;
  }

  missionSubmittingId = id;
  button.disabled = true;
  button.textContent = mt("sending");
  if(message) message.textContent = mt("wait");

  try{
    const formData = new FormData();
    formData.append("proof", file, file.name);
    formData.append("missionId", String(id));

    const response = await fetch("/api/missions/submit", {
      method:"POST",
      body:formData,
      credentials:"same-origin"
    });

    const data = await response.json();

    if(response.status === 409 && data.error === "MISSION_ALREADY_COMPLETED"){
      if(message) message.textContent = mt("already");
      await loadMissionStatus();
      return;
    }

    if(response.status === 409 && data.error === "ALREADY_PENDING"){
      if(message) message.textContent = mt("alreadyPending");
      await loadMissionStatus();
      return;
    }

    if(!response.ok || !data.success){
      const errors = {
        NO_VISITOR_SESSION:mt("session"),
        USER_NOT_FOUND:mt("notFound"),
        INVALID_IMAGE:mt("invalid"),
        INVALID_MISSION_ID:mt("failed"),
        MISSION_NOT_AVAILABLE:mt("failed"),
        TELEGRAM_DELIVERY_FAILED:mt("delivery")
      };
      throw new Error(errors[data.error] || mt("failed"));
    }

    if(message) message.textContent = mt("success");
    input.value = "";
    await loadMissionStatus();

  }catch(error){
    if(message) message.textContent = error.message || mt("failed");
  }finally{
    missionSubmittingId = null;
    await loadMissionStatus();
  }
}

(function(){
 const buttons={android:document.getElementById("download"),ios:document.getElementById("iphoneButton"),beta:document.getElementById("betaButton")};

// OXIDE HUB realistic falling rain + water droplets sliding over glass.
(function initOxideRealRain(){
 const canvas=document.getElementById('oxideRainCanvas');
 if(!canvas || !canvas.getContext) return;
 const ctx=canvas.getContext('2d',{alpha:true});
 if(!ctx) return;
 let w=0,h=0,dpr=1,raf=0,last=0,raindrops=[],glassDrops=[];
 const rand=(a,b)=>a+Math.random()*(b-a);
 function resize(){
   const rect=canvas.getBoundingClientRect();
   w=Math.max(1,rect.width);h=Math.max(1,rect.height);
   dpr=Math.min(window.devicePixelRatio||1,2.5);
   canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
   ctx.setTransform(dpr,0,0,dpr,0,0);
   const count=Math.max(100,Math.min(440,Math.round(w*h/3000)));
   raindrops=Array.from({length:count},()=>({x:rand(-20,w+20),y:rand(-h,h),len:rand(9,25),speed:rand(420,850),width:rand(.55,1.35),alpha:rand(.16,.48),drift:rand(-28,18)}));
   glassDrops=Array.from({length:Math.max(24,Math.min(85,Math.round(w/7)))},()=>makeGlassDrop(true));
 }
 function makeGlassDrop(initial=false){
   const r=rand(1.1,4.4);
   return {x:rand(0,w),y:initial?rand(0,h):rand(-35,-5),r,vy:rand(7,25),vx:rand(-2,2),trail:rand(12,48),alpha:rand(.18,.48),wobble:rand(0,Math.PI*2)};
 }
 function drawRain(dt){
   for(const d of raindrops){
     d.y+=d.speed*dt;d.x+=d.drift*dt;
     if(d.y>h+35){d.y=rand(-90,-10);d.x=rand(-10,w+10)}
     if(d.x>w+25)d.x=-20;if(d.x< -25)d.x=w+20;
     const g=ctx.createLinearGradient(d.x,d.y-d.len,d.x+d.drift*.035,d.y);
     g.addColorStop(0,'rgba(204,235,255,0)');
     g.addColorStop(.35,`rgba(202,231,255,${d.alpha*.48})`);
     g.addColorStop(1,`rgba(235,248,255,${d.alpha})`);
     ctx.beginPath();ctx.strokeStyle=g;ctx.lineWidth=d.width;ctx.lineCap='round';
     ctx.moveTo(d.x,d.y-d.len);ctx.lineTo(d.x+d.drift*.035,d.y);ctx.stroke();
   }
 }
 function drawGlassDrops(dt,time){
   for(let i=0;i<glassDrops.length;i++){
     const d=glassDrops[i];
     d.y+=d.vy*dt;d.x+=Math.sin(time*.0007+d.wobble)*d.vx*dt;
     if(d.y>h+50){glassDrops[i]=makeGlassDrop(false);continue}
     // faint wet trail behind the bead
     const trail=ctx.createLinearGradient(d.x,d.y-d.trail,d.x,d.y);
     trail.addColorStop(0,'rgba(195,229,255,0)');
     trail.addColorStop(1,`rgba(198,229,255,${d.alpha*.23})`);
     ctx.beginPath();ctx.strokeStyle=trail;ctx.lineWidth=Math.max(.7,d.r*.55);ctx.lineCap='round';
     ctx.moveTo(d.x,d.y-d.trail);ctx.lineTo(d.x,d.y);ctx.stroke();
     // convex droplet with cool edge and bright reflected highlight
     const rg=ctx.createRadialGradient(d.x-d.r*.36,d.y-d.r*.42,.2,d.x,d.y,d.r*1.35);
     rg.addColorStop(0,`rgba(255,255,255,${d.alpha*.9})`);
     rg.addColorStop(.28,`rgba(206,235,255,${d.alpha*.42})`);
     rg.addColorStop(.72,`rgba(96,164,220,${d.alpha*.19})`);
     rg.addColorStop(1,'rgba(225,245,255,0)');
     ctx.beginPath();ctx.fillStyle=rg;ctx.ellipse(d.x,d.y,d.r*.78,d.r*1.18,0,0,Math.PI*2);ctx.fill();
     ctx.beginPath();ctx.strokeStyle=`rgba(231,247,255,${d.alpha*.65})`;ctx.lineWidth=.65;
     ctx.ellipse(d.x-d.r*.12,d.y-d.r*.12,d.r*.48,d.r*.78,-.18,Math.PI*1.08,Math.PI*1.78);ctx.stroke();
     ctx.beginPath();ctx.fillStyle=`rgba(255,255,255,${d.alpha*.8})`;ctx.ellipse(d.x-d.r*.25,d.y-d.r*.42,Math.max(.45,d.r*.15),Math.max(.7,d.r*.25),-.3,0,Math.PI*2);ctx.fill();
   }
 }
 function frame(now){
   if(document.hidden){raf=requestAnimationFrame(frame);return}
   const dt=Math.min(.04,(now-last||16.7)/1000);last=now;
   ctx.clearRect(0,0,w,h);
   drawRain(dt);drawGlassDrops(dt,now);
   raf=requestAnimationFrame(frame);
 }
 resize();
 if('ResizeObserver' in window){new ResizeObserver(resize).observe(canvas)}else window.addEventListener('resize',resize,{passive:true});
 document.addEventListener('visibilitychange',()=>{last=performance.now()});
 raf=requestAnimationFrame(frame);
})();

async function loadGoogleSignIn(){if(oxideGoogleReady)return;try{const configResponse=await fetch("/api/auth/config",{cache:"no-store"});const config=await configResponse.json();oxideGoogleClientId=config.googleClientId||"";if(!oxideGoogleClientId){document.getElementById("googleSignInButton").innerHTML='<span style="color:#8ea4c2;font-size:11px">Google يحتاج إعدادًا من مدير الموقع</span>';return;}if(!window.google?.accounts?.id){await new Promise((resolve,reject)=>{const script=document.createElement("script");script.src="https://accounts.google.com/gsi/client";script.async=true;script.defer=true;script.onload=resolve;script.onerror=reject;document.head.appendChild(script);});}google.accounts.id.initialize({client_id:oxideGoogleClientId,callback:handleGoogleCredential,auto_select:false,cancel_on_tap_outside:true});google.accounts.id.renderButton(document.getElementById("googleSignInButton"),{theme:"filled_black",size:"large",shape:"pill",text:"continue_with",width:280});oxideGoogleReady=true;}catch(error){document.getElementById("googleSignInButton").innerHTML='<span style="color:#ffb8b8;font-size:11px">تعذر تحميل تسجيل Google</span>';}}
